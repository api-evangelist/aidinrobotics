  probe:
    initialize:
      http_status: 200
      server_name: Site Visitor Assistant for site "AIDIN ROBOTICS" (https://www.aidinrobotics.co.kr/_api/mcp)
      protocol_version: '2025-06-18'
      raw: mcp/aidinrobotics-mcp-initialize.json
    tools_list:
      http_status: 200
