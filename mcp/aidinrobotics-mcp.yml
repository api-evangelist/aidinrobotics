generated: '2026-09-14'
method: probed
status: published
source: https://www.aidinrobotics.co.kr/_api/mcp
description: >-
  AIDIN ROBOTICS serves a live, unauthenticated remote MCP endpoint at
  https://www.aidinrobotics.co.kr/_api/mcp, advertised in the company's own /llms.txt under an
  "AI 에이전트 액세스" (AI agent access) section. An anonymous JSON-RPC initialize returned
  serverInfo.name 'Site Visitor Assistant for site "AIDIN ROBOTICS"
  (https://www.aidinrobotics.co.kr/_api/mcp)' at protocol version 2025-06-18, and tools/list
  returned 9 tools with full inputSchemas. This is the only network-callable API surface AIDIN
  ROBOTICS publishes — the company is a robot-sensor manufacturer whose first-party developer
  material is a device-side C++/ROS SDK on GitHub, not a web API.
authorship: platform
authorship_note: >-
  This is the stock Wix Site MCP server, not a server AIDIN ROBOTICS wrote. The tool set
  (GetBusinessDetails, SearchInSite, SearchSiteApiDocs, GenerateVisitorToken, CallWixSiteAPI,
  ExecuteWixAPI, ReadFullDocsArticle, ReadFullDocsMethodSchema, BrowseWixRESTDocsMenu) is
  byte-identical across Wix tenants and is documented at
  https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp, which
  the company's own llms.txt links. AIDIN ROBOTICS' contribution is enabling it on its own host
  and advertising it; the surface is real and reachable, but it is a platform affordance, not
  provider-authored API design.
server:
  name: Site Visitor Assistant for site "AIDIN ROBOTICS" (https://www.aidinrobotics.co.kr/_api/mcp)
  version: 1.0.0
  transport: http
  url: https://www.aidinrobotics.co.kr/_api/mcp
  protocol_version: '2025-06-18'
  auth: none
  capabilities:
    tools:
      listChanged: true
    logging: {}
deployment:
  mode: remote
  endpoint: https://www.aidinrobotics.co.kr/_api/mcp
  auth: none
