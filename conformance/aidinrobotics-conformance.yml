description: >-
  AIDIN ROBOTICS conforms to nothing in the usual API-standards sense — there is no OAuth, no OIDC,
  no SCIM, no OData, no RFC 9457, no JSON:API, because there is no REST surface for any of them to
  live on. The standards it DOES implement are the ones its market actually runs on, and they are
  declared in the contract rather than claimed on a marketing page: the AIDIN Hand Gen2 SDK speaks
  CiA 402 to the actuator drives, frames it over CAN-FD on Linux SocketCAN, and says so in its own
  source and setup documentation. Alongside that sit the publishing conventions the SDK adopts by
  name (Semantic Versioning, Keep a Changelog, SPDX/Apache-2.0) and, on the web side, one probed
  protocol version. Product-level marks (ISO 9001, CE, KC, FCC, RoHS) are published on the
  company's certification page and are recorded separately below, because they certify hardware,
  not an interface.
conformance:
- id: cia-402
  label: CiA 402 / CANopen drive profile (IEC 61800-7-201)
  conforms: true
  domain_standard: true
  evidence: https://github.com/aidinrobotics/aidin-hand2-sdk/blob/main/cpp/src/hand_core/comms/state_machine/cia402.hpp
  note: >-
    The SDK implements the CiA 402 status-word and control-word rules as a dedicated, unit-tested
    module and drives each actuator through the profile's state machine (Ready to Switch On,
    Switched On, Operation Enabled, Fault, Quick Stop Active, plus mode-6 homing bits 12/13). The
    header's own comment sets the boundary precisely: "CiA402 is implementation vocabulary and is
    never exposed on the public API" — so the hand conforms on the wire while the C++ API stays
    profile-agnostic. This is the domain-standard signature for this market: an integrator who
    already speaks CiA 402 recognises the drive behaviour without a bespoke connector.
- id: can-fd-socketcan
  label: CAN FD (ISO 11898-1) over Linux SocketCAN
  conforms: true
  domain_standard: true
  evidence: https://github.com/aidinrobotics/aidin-hand2-sdk/blob/main/docs/en/05_can_fd_setup.md
  note: >-
    Documented bit timing is 1 Mbit/s nominal and 5 Mbit/s data phase, brought up as a standard
    SocketCAN link with CAN_RAW_FD_FRAMES; the setup guide names two commodity adapters (PEAK
    PCAN-USB FD, CANable 2.0 Pro / candleLight) and the kernel symbols CONFIG_CAN_PEAK_USB and
    CONFIG_CAN_GS_USB. No proprietary transport or vendor driver is required.
- id: semver
  label: Semantic Versioning 2.0.0
  conforms: true
  evidence: https://github.com/aidinrobotics/aidin-hand2-sdk/blob/main/CHANGELOG.md
  note: >-
    Declared by name in CHANGELOG.md, with the covered surface stated explicitly (the public C++
    API and the CMake package). Pre-1.0, so minor bumps may break.
- id: keep-a-changelog
  label: Keep a Changelog
  conforms: true
  evidence: https://github.com/aidinrobotics/aidin-hand2-sdk/blob/main/CHANGELOG.md
  note: Declared by name; entries use Added / Changed / Fixed / Documentation groupings.
- id: spdx-apache-2
  label: SPDX identifiers + Apache License 2.0
  conforms: true
  evidence: https://github.com/aidinrobotics/aidin-hand2-sdk/blob/main/LICENSE
  note: >-
    Source files carry SPDX-License-Identifier headers, and the repository ships NOTICE and
    THIRD_PARTY_NOTICES.md with per-component licences and source locations, as Apache-2.0
    redistribution requires.
- id: mcp-2025-06-18
  label: Model Context Protocol, revision 2025-06-18
  conforms: true
  evidence: https://www.aidinrobotics.co.kr/_api/mcp
  note: >-
