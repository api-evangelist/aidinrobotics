- id: ros2
  label: ROS 2 package conventions (ament / colcon)
  conforms: true
  evidence: https://github.com/aidinrobotics/AFT_rs485/tree/dashing-devel
  note: >-
    The AFT_rs485 driver ships package.xml, setup.py and ament linter tests (copyright, flake8,
    pep257) on its dashing-devel branch, and catkin CMakeLists on the ROS 1 branches. Target is
    ROS 2 Dashing, which reached end of life in May 2021. The Hand Gen2 SDK carries a COLCON_IGNORE
    file — it deliberately opts OUT of a colcon workspace build, with the ROS 2 wrapper kept in a
    separate (currently unreachable) repository.
