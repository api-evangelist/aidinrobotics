- version: 0.5.2
  date: '2026-09-10'
  breaking: true
  highlights:
  - Support for the 2 mm thumb ball-screw lead alongside the 1 mm one, selected at build time with -DAIDIN_HAND2_THUMB_LEAD=2mm.
  - 'Breaking: libaidin_hand2_kinematics.so.<SDK version> replaces libaidin_hand2_kinematics.so.1, so consumers must relink.'
  - The prebuilt kinematics library no longer carries a version of its own; its file name now comes from the project version.
  note: >-
    The [!IMPORTANT] callout on this entry documents a real silent-corruption incident: under the
    fixed soname a 0.5.0 kinematics library satisfied a 0.5.1 consumer, and two thumb actuators
    converted at half the counts per millimetre with no diagnostic. A mismatch now fails to load
    and names the file it wanted.
- version: 0.5.1
  date: '2026-09-10'
  breaking: false
  highlights:
  - arm64 becomes a shipped architecture (cpp/prebuilt/aarch64).
  - CI covers x86_64 and arm64 on Ubuntu 22.04 and 24.04, with unit tests re-run under ThreadSanitizer.
  - 'Thumb d1/d2 screws changed from a 2 mm to a 1 mm lead; kinematics converts those actuators at twice the count per millimetre. Public API unchanged.'
