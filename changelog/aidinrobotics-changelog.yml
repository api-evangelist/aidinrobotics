  AIDIN ROBOTICS maintains one dated, machine-locatable changelog: CHANGELOG.md in the AIDIN Hand
  Gen2 SDK repository. It declares its own format ("based on Keep a Changelog", "adheres to
  Semantic Versioning") and names exactly what the version number covers — the public C++ API,
  meaning the headers under include/aidin_hand2/ and the CMake package. Entries are grouped under
