aid: aidinrobotics
name: AIDIN ROBOTICS
description: >-
  AIDIN ROBOTICS Inc. (에이딘로보틱스) is a South Korean robot-sensor company founded in 2019 out of
  the Robotics Innovatory lab in the Department of Mechanical Engineering at Sungkyunkwan
  University, and headquartered in Anyang, Gyeonggi-do. It builds the force-sensing layer that
  sits between a robot and the physical world: six-axis force/torque sensors (AFT200 series),
  miniature and three-axis F/T sensors, ultra-thin joint torque sensors (ATS/ATSB series),
  proximity and tactile safety sensors, the Susgrip smart gripper, the AIDIN Hand Gen2 robot hand,
  the ARC robot motion controller, and the AIDIN9 quadruped platform. Sensors ship in EtherCAT,
  EtherNet/IP, CAN and RS-485 variants and carry ISO 9001, CE, KC, FCC and RoHS marks. AIDIN
  ROBOTICS runs no web API product and publishes no OpenAPI, GraphQL, AsyncAPI, gRPC or SOAP
  contract. Its real developer surface is device-side and first-party: the Apache-2.0 AIDIN Hand
  Gen2 SDK on GitHub — a C++ library speaking CAN-FD over Linux SocketCAN with a CiA 402 drive
  state machine, a documented error catalog, a Keep a Changelog history and semantic versioning —
  plus an older ROS package for reading the AFT force/torque sensor over RS-485. Alongside that,
  the company's Wix-hosted marketing site serves a company-authored llms.txt and an anonymous
  remote Model Context Protocol endpoint, which is the only network-callable API surface it
  publishes.
