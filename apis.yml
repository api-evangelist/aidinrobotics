apis:
- aid: aidinrobotics:site-mcp
  name: AIDIN ROBOTICS Site MCP
  description: >-
    An anonymous remote Model Context Protocol endpoint served on AIDIN ROBOTICS' own host and
    advertised in the company's own /llms.txt under an "AI 에이전트 액세스" section. An unauthenticated
    JSON-RPC initialize returns serverInfo.name 'Site Visitor Assistant for site "AIDIN ROBOTICS"'
    and tools/list returns nine tools with full inputSchemas — business details, site search, site
    API-doc search, visitor-token minting, and two call/execute tools that act on a visitor's
    behalf. The implementation is the stock Wix Site MCP server, enabled by AIDIN ROBOTICS on its
    own domain; it is the only network-callable API surface the company publishes.
  humanURL: https://www.aidinrobotics.co.kr/llms.txt
  image: https://static.wixstatic.com/media/d71e42_e1d5db6bf45d40c484b0c0ff01481556%7Emv2.png/v1/fit/w_2500,h_1330,al_c/d71e42_e1d5db6bf45d40c484b0c0ff01481556%7Emv2.png
  baseURL: https://www.aidinrobotics.co.kr/_api/mcp
