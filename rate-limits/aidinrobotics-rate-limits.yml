device_side_note: >-
  The SDK has no quota, but it does have a hard scheduling contract that plays the same role for an
  integrator: the control and communication loop runs at a fixed control_rate (default 500 Hz) and
  the communication layer treats roughly 100 ms without received frames as an error, failing
  connect() outright if no first frame arrives within 300 ms and raising HardwareFault if the
  drives do not reach quick stop within 500 ms. Those are real, documented timing budgets — see
  conventions/aidinrobotics-conventions.yml and errors/aidinrobotics-error-codes.yml.
