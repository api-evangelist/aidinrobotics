description: >-
  AIDIN ROBOTICS publishes no API plans, because it sells no API. It sells hardware, and it does
  publish list prices for some of it: a Wix Stores catalogue with five products is live
  (store-products-sitemap.xml, last modified 2026-04-09), and an individual product page carries a
  real figure — Susgrip-FT lists at $10,000.00 USD, read from the product page's own structured
  price data on 2026-09-14. There is no plans page, no tier table, no quota, no overage and no
  metered anything. The software that does exist — the AIDIN Hand Gen2 SDK and the AFT_rs485 ROS
  driver — is free and Apache-2.0 on GitHub with no licence key, no seat count and no commercial
  edition. The MCP endpoint on the marketing site is free and anonymous.
