packages:
- name: aidin-hand2-sdk
  language: C++
  official: true
  registry: github
  url: https://github.com/aidinrobotics/aidin-hand2-sdk
  version: 0.5.2
  published: '2026-09-10'
  license: Apache-2.0
  install: >-
    Source build only — cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=RelWithDebInfo &&
    cmake --build cpp/build && sudo cmake --install cpp/build. Depends on spdlog >= 1.9 and
    can-utils on Ubuntu 22.04/24.04, GCC >= 11, CMake >= 3.16.
  description: >-
    C++ SDK for the AIDIN Hand Gen2, a 16-actuator / 21-joint robot hand with 85 fingertip and 58
    palm tactile taxels. Talks CAN-FD over Linux SocketCAN (1 Mbit/s nominal, 5 Mbit/s data) to a
    CiA 402 drive state machine, runs a 500 Hz real-time control loop, and exposes a lifecycle
    API with position, impedance, joint-position, joint-impedance, actuator-position and
    actuator-effort command modes plus state, tactile and diagnostics observation.
  currency_note: >-
    Version and date come from CHANGELOG.md, which records 0.5.2 on 2026-09-10 and is the
    repository's own release record; the latest git tag is v0.5.1 and no GitHub Release object
    has been cut, so the tag stream lags the changelog by one version. Eight versions have shipped
    (0.1.0 through 0.5.2) with the first dated entry on 2026-08-24 — this is an actively developed
    SDK, four days old at its latest release when probed.
  provenance: >-
    fork:false on the GitHub API — first-party, not a fork. Apache-2.0 with a NOTICE and
    THIRD_PARTY_NOTICES.md.
  caveats:
  - >-
    Python bindings are announced in the README architecture diagram and in docs/en/10-12 but every
    one of those three pages is a "planned" placeholder; the shipped package is C++ only.
  - >-
    cpp/prebuilt/<arch>/libaidin_hand2_kinematics.so.0.5.2 ships as a BINARY blob (x86_64 and
    aarch64). The repository states the kinematics equations and hand geometry constants are not
    published and the Apache-2.0 licence permits object-form distribution, so the SDK is
    source-available but not fully source-complete.
  - >-
    A related repository, aidin-hand2-ros2 (a ROS 2 wrapper), is linked from the README but
    returns HTTP 404 on the GitHub API — it is either private or not yet published. The README
    also lists a browser GUI / WebSocket bridge as "pending".
