method: searched
source: https://github.com/aidinrobotics
description: >-
  AIDIN ROBOTICS publishes first-party client software on GitHub only. Six repositories sit under
  the aidinrobotics org; four of them (SMACC2, mujoco_ros2_control, flexbe_behavior_engine,
  flexbe_app) are unmodified-purpose FORKS of third-party ROS 2 projects and are NOT AIDIN
  packages, so they are recorded below as excluded rather than counted. The two first-party
  packages are the AIDIN Hand Gen2 SDK and an older ROS driver for the AFT force/torque sensor
  over RS-485. Neither is published to a package registry: npm, PyPI, RubyGems, crates.io, NuGet,
  Maven Central and pkg.go.dev were all probed and returned 404 for every plausible name, so
  version and publication date are read from the repository's own CHANGELOG, tags and commit
  history instead.
registry_probes:
